name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  MOD_VERSION: "x.x.x"
  MOD_BUILD_STAGE: "prod"

permissions:
  contents: read

jobs:
  build-base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Build base content pack
        run: uv run python3 src/main.py

      - name: Get metadata
        run: |
          echo "MOD_VERSION=$(cat out/LATEST)" >> $GITHUB_ENV

      - name: Save base content pack
        uses: actions/upload-artifact@v4
        with:
          name: orientalmelon.baechusportraits-${{ env.MOD_VERSION }}-base
          path: out/orientalmelon.baechusportraits-*-base
          if-no-files-found: error

  build-sve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Build SVE content pack
        run: uv run python3 src/main.py -e SVE

      - name: Get metadata
        run: |
          echo "MOD_VERSION=$(cat out/LATEST)" >> $GITHUB_ENV

      - name: Save SVE content pack
        uses: actions/upload-artifact@v4
        with:
          name: orientalmelon.baechusportraits-${{ env.MOD_VERSION }}-base-sve
          path: out/orientalmelon.baechusportraits-*-base-sve
          if-no-files-found: error
