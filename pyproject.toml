[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baechus-portraits-cp"
version = "1.3.3"
description = "Baechu's Portraits mod updated for Content Patcher. The original art is from Baechu's Portraits."
authors = [{name = "Taewon Kim", email = "taewonkim2001@outlook.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 150
exclude = [".git", ".venv", "__pycache__", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
